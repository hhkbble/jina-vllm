[project]
name = "jina-reranker-v35-vllm"
version = "0.1.0"
description = "Out-of-tree vLLM support for Jina Reranker v3.5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
]

[tool.uv]
# Initialization only: add packaging and plugin entry points with implementation.
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
